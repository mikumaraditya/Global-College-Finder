<!DOCTYPE html>
<html class="dark scroll-smooth" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>CollegeAtlas | Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&amp;family=Inter:wght@400;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#050608",
                        "surface": "#111318",
                        "accent-cyan": "#00F0FF",
                        "on-surface": "#e2e2e8",
                        "text-primary": "#FFFFFF",
                        "text-secondary": "#94A3B8"
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }
        .glow-button {
            background: linear-gradient(135deg, #7000ff 0%, #00F0FF 100%);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-size: 200% auto;
        }
        .glow-button:hover {
            background-position: right center;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            transform: scale(1.02);
        }
        .input-glow:focus {
            border-color: #00F0FF !important;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
        }

        /* Canvas particles */
        #particle-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
        }
        /* Animated Background */
        .animated-bg {
            background: linear-gradient(135deg, #050608 0%, #0e1017 50%, #050608 100%);
            background-size: 400% 400%;
            animation: bg-shift 15s infinite ease-in-out;
        }
        @keyframes bg-shift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Custom Toast */
        .custom-toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #1a1c20;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 16px 28px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            font-weight: 500;
            font-size: 0.95rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10000;
            pointer-events: none;
        }
        .custom-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .custom-toast.success {
            border-left: 4px solid #00F0FF;
        }
        .custom-toast.error {
            border-left: 4px solid #DC3545;
        }

        /* Custom Scrollbar Styles */
        /* For Webkit-based browsers (Chrome, Edge, Safari) */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050608;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00F0FF;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* Specific scrollbar styling */
        div::-webkit-scrollbar {
            width: 6px;
        }
        div::-webkit-scrollbar-thumb {
            background: rgba(0, 240, 255, 0.2);
        }
        div::-webkit-scrollbar-thumb:hover {
            background: #00F0FF;
        }

        /* For Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 240, 255, 0.25) #050608;
        }

        /* Smooth Scrolling */
        html,
        div {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="animated-bg text-on-surface font-body-md overflow-x-hidden min-h-screen flex items-center justify-center relative">
<canvas id="particle-canvas"></canvas>


<!-- Background circular layout image -->
<div class="absolute right-[-100px] top-[10%] w-[550px] h-[550px] rounded-full overflow-hidden pointer-events-none opacity-20 hidden lg:block border border-purple-500/20">
    <div class="absolute inset-0 bg-gradient-to-r from-background via-purple-900/40 to-transparent z-10"></div>
    <img src="https://lh3.googleusercontent.com/aida/AP1WRLsJYjqUES3vHzJwnErlkgJGSPOYvSVetKE6DWAkhLGJg3_1YfnUUN3URW_WntAR4twkc9tJkvYDWYk2FmFWa97BtiKC5dD1P_4WPJ66793SdkRsXvKZoIkPoOcOtA0iG4p7TVLIgp5e2tXQVuSDwCi4bcn66hX8Z2wI9aK3a7SJWyNqv9RuG5aIrSJTrQXvmzcKYWr4Uvu9sdnQ1eLy5YaUIAJ8hCo-X8-dc_IFXofnYyhQ5szt2vINVQ" class="w-full h-full object-cover grayscale brightness-50 contrast-125" alt="Skyline crop">
</div>

<!-- Login Card -->
<div class="glass-card w-full max-w-[460px] rounded-2xl p-10 mx-4 z-10 text-center relative">
    <a href="index.html" class="inline-block font-headline-md text-headline-md font-bold text-accent-cyan tracking-tight mb-6">CollegeAtlas</a>
    <h2 class="text-white text-2xl font-bold font-headline-lg mb-2">Welcome Back</h2>
    <p class="text-text-secondary text-sm mb-8">Continue your journey to find the perfect college.</p>

    <form id="login-form" class="space-y-6">
        <div class="space-y-2 text-left">
            <label class="font-label-bold text-text-secondary uppercase text-[10px] tracking-widest font-semibold">Email Address</label>
            <input class="w-full bg-[#050608]/40 border border-white/15 focus:border-accent-cyan rounded-lg p-3 text-white transition-all text-sm outline-none input-glow" placeholder="name@university.edu" type="email" required/>
        </div>
        <div class="space-y-2 text-left">
            <label class="font-label-bold text-text-secondary uppercase text-[10px] tracking-widest font-semibold">Password</label>
            <input class="w-full bg-[#050608]/40 border border-white/15 focus:border-accent-cyan rounded-lg p-3 text-white transition-all text-sm outline-none input-glow" placeholder="••••••••" type="password" required/>
        </div>

        <div class="flex justify-between items-center text-xs">
            <label class="flex items-center gap-2 cursor-pointer group text-text-secondary">
                <input class="rounded bg-[#050608] border-white/15 text-accent-cyan focus:ring-accent-cyan" type="checkbox"/>
                <span class="group-hover:text-white transition-colors">Remember me</span>
            </label>
            <a href="#" class="text-accent-cyan hover:underline">Forgot Password?</a>
        </div>

        <button class="glow-button w-full py-3.5 rounded-lg font-bold text-white uppercase tracking-wider text-sm mt-4 shadow-xl flex items-center justify-center gap-2" type="submit">
            Login <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
        </button>
    </form>

    <div class="relative my-8 flex items-center justify-center">
        <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-white/10"></div>
        </div>
        <span class="relative bg-[#111318]/0 px-4 text-[10px] text-text-secondary uppercase tracking-widest">or continue with</span>
    </div>

    <!-- OAuth Buttons -->
    <div class="grid grid-cols-2 gap-4">
        <button class="flex items-center justify-center gap-2 py-3 rounded-lg border border-white/10 hover:border-white/25 hover:bg-white/5 transition-all text-sm font-medium text-white">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.65-.6-1.19-1.34-1.34-2.19z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Google
        </button>
        <button class="flex items-center justify-center gap-2 py-3 rounded-lg border border-white/10 hover:border-white/25 hover:bg-white/5 transition-all text-sm font-medium text-white">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.779-1.75-1.75s.784-1.75 1.75-1.75 1.75.779 1.75 1.75-.784 1.75-1.75 1.75zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
            </svg>
            LinkedIn
        </button>
    </div>

    <p class="text-xs text-text-secondary mt-8">Don't have an account? <a href="signup.html" class="text-accent-cyan font-semibold hover:underline">Sign Up</a></p>
</div>

<div id="toast"></div>

<!-- Logic handler script -->
<script>
    // Redirect to dashboard if already logged in
    (async () => {
        const API_BASE = (window.location.origin.includes("localhost:3000") || window.location.origin.includes("127.0.0.1:3000"))
            ? ""
            : "http://localhost:3000";
        try {
            const res = await fetch(`${API_BASE}/auth`, { credentials: "include" });
            const data = await res.json();
            if (res.ok && data.success) {
                window.location.href = "index.html";
            }
        } catch (err) {
            console.log("Not logged in");
        }
    })();

    // Form submission
    const form = document.querySelector("#login-form");
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const emailInput = form.querySelector('input[type="email"]');
        const passwordInput = form.querySelector('input[type="password"]');
        
        const API_BASE = (window.location.origin.includes("localhost:3000") || window.location.origin.includes("127.0.0.1:3000"))
            ? ""
            : "http://localhost:3000";

        try {
            const response = await fetch(`${API_BASE}/signin`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({
                    email: emailInput.value,
                    password: passwordInput.value
                })
            });
            
            const data = await response.json();
            if (response.ok && data.success) {
                showToast("Login successful! Redirecting...", "success");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500);
            } else {
                showToast(data.message || data.error || "Login failed", "error");
            }
        } catch (err) {
            console.error("Login connection error:", err);
            showToast("Server connection error. Please try again.", "error");
        }
    });

    // Toast Utility
    function showToast(message, type = "success") {
        const toast = document.createElement("div");
        toast.classList.add("custom-toast", type);
        toast.innerText = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add("show"), 100);
        setTimeout(() => {
            toast.classList.remove("show");
            setTimeout(() => {
                if (document.body.contains(toast)) document.body.removeChild(toast);
            }, 400);
        }, 3000);
    }



    // Canvas Particles
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 1.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.3;
            this.speedY = (Math.random() - 0.5) * 0.3;
            this.opacity = Math.random() * 0.5 + 0.1;
        }
        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
        }
        draw() {
            ctx.fillStyle = `rgba(0, 240, 255, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function initParticles() {
        particles = [];
        for (let i = 0; i < 40; i++) particles.push(new Particle());
    }
    initParticles();

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.update();
            p.draw();
        });
        requestAnimationFrame(animateParticles);
    }
    animateParticles();
</script>
</body>
</html>
